LABEL arch64
TEXT HELP
Boot the UndraByte Linux live desktop.
ENDTEXT
MENU LABEL UndraByte Linux (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL arch64nomodeset
TEXT HELP
Same, but with kernel mode setting disabled. Use this when the desktop
comes up black in an old hypervisor or on exotic hardware.
ENDTEXT
MENU LABEL UndraByte Linux (safe graphics / nomodeset)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset

LABEL arch64ram
TEXT HELP
Copy the system to RAM, then release the boot medium. Needs ~4 GB of RAM.
ENDTEXT
MENU LABEL UndraByte Linux (copy to RAM)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram

LABEL arch64console
TEXT HELP
Boot to a text console with no display manager.
ENDTEXT
MENU LABEL UndraByte Linux (console only)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.unit=multi-user.target undrabyte.nodm=1
