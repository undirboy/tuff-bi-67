LABEL existing
TEXT HELP
Boot an operating system already installed on this machine.
ENDTEXT
MENU LABEL Boot existing OS
COM32 boot/syslinux/chain.c32
APPEND hd0 0

LABEL memtest
MENU LABEL Run Memtest86+ (RAM test)
LINUX /%INSTALL_DIR%/boot/memtest86+/memtest

LABEL reboot
MENU LABEL Reboot
COM32 boot/syslinux/reboot.c32

LABEL poweroff
MENU LABEL Power off
COM32 boot/syslinux/poweroff.c32

MENU SEPARATOR
MENU LABEL HexForge Linux -- use only on systems you are authorised to test.

TIMEOUT 150
DEFAULT arch64
