# UndraByte Linux - GRUB menu for UEFI boot.
# %ARCHISO_LABEL%, %INSTALL_DIR% and %ARCH% are substituted by mkarchiso.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

insmod all_video
insmod font

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod gfxterm
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# UndraByte boot styling. This uses only GRUB's built-in colour menu (no
# external theme files or pixmaps), so it needs nothing embedded into the
# standalone EFI image and cannot break boot: a solid dark background, the
# brand blue for the selected entry, and a title line. A full pixmap theme
# would have to be baked into the GRUB memdisk, which mkarchiso does not do -
# this gives the branded look without that fragility.
set color_normal=light-gray/black
set color_highlight=white/blue
if background_color 16,24,32 ; then
    clear
fi

set default=0
set timeout=10
set timeout_style=menu

# Every entry also carries `archisosearchfilename`. The archiso initramfs hook
# normally finds the live medium by its ISO9660 volume label (archisolabel).
# VirtualBox's firmware - and some UTM/QEMU setups - expose that label late or
# mangled, so the hook times out and drops to the emergency shell ("device did
# not show up"). archisosearchfilename makes the hook instead scan every block
# device for the squashfs file itself, which is firmware-independent; the label
# stays as a secondary clue. This is what fixes the VirtualBox boot failure.
menuentry "UndraByte Linux (x86_64, UEFI)" --class undrabyte --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/%ARCH%/airootfs.sfs
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "UndraByte Linux (safe graphics / nomodeset)" --class undrabyte --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/%ARCH%/airootfs.sfs nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "UndraByte Linux (copy to RAM - unplug the medium after boot)" --class undrabyte --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/%ARCH%/airootfs.sfs copytoram
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Persistence: mount a filesystem labelled UNDRABYTE_COW as a writable overlay
# on top of the squashfs, so changes survive reboots. Create that partition
# first with `undrabyte-persist`. If no such label is present, archiso falls
# back to a RAM overlay, so this entry is safe to pick on a stock stick too.
menuentry "UndraByte Linux (persistent - saves changes to a UNDRABYTE_COW partition)" --class undrabyte --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/%ARCH%/airootfs.sfs cow_label=UNDRABYTE_COW cow_persistent=P
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "UndraByte Linux (console only, no desktop)" --class undrabyte --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchfilename=/%INSTALL_DIR%/%ARCH%/airootfs.sfs systemd.unit=multi-user.target undrabyte.nodm=1
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "UEFI Shell" {
    insmod fat
    insmod chain
    chainloader /shellx64.efi
}

menuentry "Reboot" {
    reboot
}

menuentry "Shut down" {
    halt
}
