#
# HexForge Linux - pacman.conf used *by the build host* while assembling the
# ISO root filesystem. The installed/live system gets airootfs/etc/pacman.conf.
#
# `scripts/build-iso.sh` appends a [blackarch] section here (in the staged
# copy) when invoked with --with-blackarch.
#

[options]
HoldPkg      = pacman glibc

# mkarchiso copies profile/airootfs/ into the work directory BEFORE running
# pacstrap, so any path we ship that a package also owns is a file conflict
# and the whole transaction aborts. Paths listed here are not extracted from
# their package, leaving ours in place.
#
# Files in a package's backup array (/etc/pacman.conf, /etc/locale.gen and
# friends) are tolerated by pacman without this, but listing them anyway
# makes the outcome explicit rather than dependent on someone else's PKGBUILD.
#
# scripts/verify-packages.sh checks this list against the overlay in CI and
# fails if a new file needs an entry.
NoExtract    = usr/lib/os-release
NoExtract    = etc/skel/.zshrc
NoExtract    = etc/skel/.bashrc
NoExtract    = etc/locale.gen
NoExtract    = etc/pacman.conf
NoExtract    = etc/motd
NoExtract    = etc/mkinitcpio.d/linux.preset
Architecture = auto
CheckSpace
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
