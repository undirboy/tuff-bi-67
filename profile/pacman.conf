#
# HexForge Linux - pacman.conf used *by the build host* while assembling the
# ISO root filesystem. The installed/live system gets airootfs/etc/pacman.conf.
#
# `scripts/build-iso.sh` appends a [blackarch] section here (in the staged
# copy) when invoked with --with-blackarch.
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
