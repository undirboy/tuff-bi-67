#
# /etc/pacman.conf for a running HexForge system (live or installed).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 8
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Keep the HexForge branding when the filesystem package is upgraded.
# Without this, /usr/lib/os-release reverts to Arch's on the next -Syu.
NoExtract   = usr/lib/os-release

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch: uncomment after running `hexforge-toolkit enable-blackarch`,
# which installs the signing keyring. Enabling the repo without the keyring
# will make every pacman transaction fail signature validation.
#[blackarch]
#Include = /etc/pacman.d/blackarch-mirrorlist
