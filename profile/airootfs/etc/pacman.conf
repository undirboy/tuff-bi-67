#
# /etc/pacman.conf for a running UndraByte system (live or installed).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 8
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# The UndraByte branding is reapplied by
# /etc/pacman.d/hooks/99-undrabyte-branding.hook after any upgrade of the
# filesystem package, rather than by fighting pacman over the file.

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# BlackArch: uncomment after running `undrabyte-toolkit enable-blackarch`,
# which installs the signing keyring. Enabling the repo without the keyring
# will make every pacman transaction fail signature validation.
#[blackarch]
#Include = /etc/pacman.d/blackarch-mirrorlist
