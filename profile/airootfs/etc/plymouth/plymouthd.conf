# UndraByte default boot splash.
#
# The splash only actually renders once `plymouth` is in the initramfs HOOKS
# and `splash` is on the kernel command line. The live ISO deliberately does
# NOT add the plymouth hook to its archiso initramfs (that ordering is delicate
# and cannot be boot-tested per build), so on live media this file is a no-op.
# undrabyte-install wires the hook and the `splash` cmdline on the installed
# system, where this theme then shows at every boot.
[Daemon]
Theme=undrabyte
ShowDelay=0
