# Credentials and behaviour of the *live* session. Read by
# /usr/lib/undrabyte/live-setup.sh at boot; ignored on installed systems.
#
# Change these before building an ISO you intend to hand to someone else.
# A live image with a published password is fine on your own lab network and
# a bad idea anywhere else.

UNDRABYTE_LIVE_USER=forge
UNDRABYTE_LIVE_PASSWORD=forge

# Give the live user passwordless sudo. Convenient while triaging a broken
# machine from the ISO; set to 0 if the image will boot somewhere untrusted.
UNDRABYTE_LIVE_NOPASSWD_SUDO=1

# Unlock the root account with the same password (0 = keep root locked).
UNDRABYTE_LIVE_ROOT_ENABLED=0
