# UndraByte defaults.

# Steam, Proton and modern games map a lot of small regions.
vm.max_map_count = 2147483642

# Keep the desktop responsive when a build or a hashcat run eats the box.
vm.swappiness = 10

# Let unprivileged tools (gdb, strace on your own processes) work without
# sudo. This is a workstation/lab default, not a hardening default.
kernel.yama.ptrace_scope = 0

# Unprivileged ICMP sockets so `ping` works without setuid helpers.
net.ipv4.ping_group_range = 0 2147483647
