# Hooks that make a squashfs-on-ISO root bootable. Order matters, and this
# matches upstream archiso's releng profile.
#
# archiso_shutdown is not optional: without it the live system cannot unmount
# its own root at poweroff, and shutdown hangs or leaves the medium dirty.
#
# `microcode` bundles the Intel and AMD CPU microcode straight into the
# initramfs. It must be present: the boot loaders no longer load the microcode
# from separate intel-ucode.img/amd-ucode.img files, so this is the only place
# it gets delivered. On a live ISO we do not use `autodetect`, so the whole
# microcode set is included and the image boots on any CPU (and it is simply a
# no-op inside a VM).
# Pin the storage/optical controllers the live medium can appear behind so they
# are in the initramfs and probed early, before the archiso hook goes looking
# for the medium. Without this, detection waits on normal module autoload, which
# is exactly what is too slow on VirtualBox (ahci / ata_piix SATA/IDE, sr_mod
# optical) and on UTM/QEMU (the virtio_* controllers) - the hook then times out
# and drops to the emergency shell. usb_storage/uas cover booting from a USB
# stick; isofs/cdrom cover the optical/ISO9660 path. mkinitcpio ignores any name
# the running kernel does not provide, so this stays safe across kernel bumps.
MODULES=(ahci ata_piix sd_mod sr_mod cdrom isofs usb_storage uas virtio_pci virtio_blk virtio_scsi)
HOOKS=(base udev microcode modconf kms memdisk archiso_shutdown archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems)
COMPRESSION="zstd"
