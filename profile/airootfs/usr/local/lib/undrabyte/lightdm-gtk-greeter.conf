[greeter]
# UndraByte login screen: dark, branded, matching the desktop.
background = /usr/share/backgrounds/undrabyte/undrabyte-default.png
theme-name = Breeze-Dark
icon-theme-name = breeze-dark
font-name = Noto Sans 11
cursor-theme-name = breeze_cursors
clock-format = %a %d %b  %H:%M
indicators = ~host;~spacer;~clock;~spacer;~session;~power
position = 50%,center 55%,center
