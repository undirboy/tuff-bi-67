name: build-iso

# Builds a trimmed image to prove the profile still assembles. A `full`
# edition needs ~25 GB of scratch space and will not fit on a hosted runner;
# build those locally or on a self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Package edition'
        type: choice
        default: minimal
        options: [minimal, dev, security, gaming, full]
      desktop:
        description: 'Desktop environment'
        type: choice
        default: none
        options: [none, xfce, kde]
      upload:
        description: 'Upload the ISO as an artifact (large)'
        type: boolean
        default: false

jobs:
  build:
    name: mkarchiso
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged        # mkarchiso needs loop devices and mount
    steps:
      - name: Free up disk space on the runner
        run: |
          df -h /
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Install archiso
        run: pacman -Sy --noconfirm --needed archiso git

      - uses: actions/checkout@v4

      - name: Verify package names first
        run: |
          sed -i '/^#\[multilib\]/,+1 s/^#//' /etc/pacman.conf
          pacman -Sy --noconfirm
          ./scripts/verify-packages.sh

      - name: Build
        run: |
          ./scripts/build-iso.sh \
            --edition '${{ inputs.edition }}' \
            --desktop '${{ inputs.desktop }}' \
            --vm-only

      - name: Report
        run: |
          ls -lh out/
          sha256sum out/*.iso | tee out/SHA256SUMS

      - name: Upload the ISO
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: hexforge-${{ inputs.edition }}-${{ inputs.desktop }}
          path: out/
          retention-days: 7
          compression-level: 0
