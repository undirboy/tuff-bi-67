name: verify-packages

# Arch is a rolling release: package names get renamed, split or dropped to
# the AUR without warning. Catching that on a schedule is much cheaper than
# catching it 40 minutes into an ISO build.

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, 04:17 UTC
  pull_request:
    paths:
      - 'packages/**'
  workflow_dispatch:

jobs:
  verify:
    name: package names resolve
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v4

      # No pacman.conf surgery here: verify-packages.sh syncs into its own
      # throwaway dbpath using profile/pacman.conf, so it checks against the
      # exact repositories a build uses (multilib included) and fails loudly
      # if one of them does not sync.
      - name: Check every manifest
        run: ./scripts/verify-packages.sh
