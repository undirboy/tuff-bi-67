name: publish-release

# Repackage an already-built ISO artifact as a GitHub Release asset, which
# downloads from GitHub's CDN as a direct, resumable file (no zip, no Actions
# artifact auth path). Better for slow or flaky connections.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The build-iso run ID whose artifact to publish'
        required: true
      artifact:
        description: 'Artifact name'
        default: undrabyte-lite-xfce
      tag:
        description: 'Release tag'
        default: iso-latest

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the built ISO from the given run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p iso
          gh run download '${{ inputs.run_id }}' -R '${{ github.repository }}' \
             -n '${{ inputs.artifact }}' -D iso
          ls -lh iso/

      - name: Publish (or update) the release with the ISO attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iso="$(find iso -name '*.iso' | head -1)"
          [ -n "$iso" ] || { echo "no ISO found in the artifact"; exit 1; }

          # GitHub rejects a release asset of 2 GiB or more. Check this BEFORE
          # touching the existing release, so an oversized image fails the job
          # while leaving the current download link intact.
          bytes="$(stat -c%s "$iso")"
          limit=2147483648
          if [ "$bytes" -ge "$limit" ]; then
            echo "::error::ISO is ${bytes} bytes, at or over GitHub's 2 GiB" \
                 "release-asset limit (${limit}). Shrink the image before publishing;" \
                 "the existing release was left untouched."
            exit 1
          fi

          size="$(du -h "$iso" | cut -f1)"
          notes="UndraByte ${{ inputs.artifact }} live ISO ($size). Direct, resumable CDN download. Boot in UTM or QEMU."

          # Create the release only if the tag does not exist yet; never delete
          # it first. Then replace the asset in place with --clobber, so a
          # failed upload can never leave the tag with no downloadable ISO.
          if ! gh release view '${{ inputs.tag }}' -R '${{ github.repository }}' >/dev/null 2>&1; then
            gh release create '${{ inputs.tag }}' \
               -R '${{ github.repository }}' \
               --title 'UndraByte live ISO' \
               --notes "$notes" \
               --target '${{ github.sha }}'
          else
            gh release edit '${{ inputs.tag }}' -R '${{ github.repository }}' --notes "$notes"
          fi
          gh release upload '${{ inputs.tag }}' "$iso" -R '${{ github.repository }}' --clobber

          echo "Release asset URL:"
          gh release view '${{ inputs.tag }}' -R '${{ github.repository }}' --json assets \
             --jq '.assets[].url'
