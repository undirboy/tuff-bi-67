name: lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shell, manifests, profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run the repository checks
        run: ./scripts/lint.sh

      - name: Resolve every edition
        run: |
          for edition in full security dev gaming minimal; do
            for desktop in kde xfce none; do
              count=$(./scripts/build-iso.sh --edition "$edition" --desktop "$desktop" \
                        --list-packages 2>/dev/null | wc -l)
              printf '%-9s %-5s %4d packages\n' "$edition" "$desktop" "$count"
            done
          done
